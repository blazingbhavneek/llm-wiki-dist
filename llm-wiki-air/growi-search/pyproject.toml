[project]
name = "growi-search"
version = "0.1.0"
description = "Read-only GROWI search + research service (no local index)"
requires-python = ">=3.13"
dependencies = [
  "fastapi",
  "httpx==0.28.1",
  "langchain-core==1.6.3",
  "langchain-openai==1.6.2",
  "langgraph",
  "pydantic==2.13.5",
  "python-dotenv==1.2.3",
  "uvicorn[standard]",
]

[tool.uv]
package = false
