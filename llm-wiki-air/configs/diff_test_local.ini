[project]
source_mount = /tmp/llm-wiki-diff-test/mount
target_name = diff_test_local
data_root = data-local

[settings]
chat_base_url = http://127.0.0.1:8080/v1
chat_api_key = local
chat_model = gemma-4-12B
parser_base_url = http://127.0.0.1:8000/agent/doc-parser/
embed_base_url = http://127.0.0.1:8080/v1
embed_api_key = local
embed_model = gemma-4-12B
wiki_linker_enabled = true
concurrency = 1
wiki_request_timeout = 600
structure_target_lines = 30
structure_min_lines = 10
