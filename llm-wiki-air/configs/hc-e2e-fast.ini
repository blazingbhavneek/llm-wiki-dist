# Live end-to-end test of human edits on the local GROWI (/hc-e2e-fast), synthetic source only.
# Run with `sync --fast`; linking is off so pages publish unlinked. GROWI_TOKEN comes from .env.
[project]
source_mount = /mnt/common/Code/llm-wiki-dist/llm-wiki-air/data/mount-e2e-fast
target_name = hc-e2e-fast
data_root = data
growi_url = http://localhost:3000

[settings]
human_sync_mode = apply
structure_target_lines = 80
wiki_linker_enabled = false
