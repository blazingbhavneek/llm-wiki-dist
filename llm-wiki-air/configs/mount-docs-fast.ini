# Same mount as mount-docs.ini, published to its own GROWI tree (/mountdocs-fast) so fast
# test runs never touch /mountdocs. No token here: pass GROWI_TOKEN in the environment.
[project]
source_mount = /mnt/common/Code/llm-wiki-dist/llm-wiki-air/data/mount
target_name = mountdocs-fast
data_root = data
parser_base_url = http://127.0.0.1:8000/agent/doc-parser/
growi_url = http://localhost:3000
