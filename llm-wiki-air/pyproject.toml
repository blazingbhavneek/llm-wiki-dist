[project]
name = "llm-wiki-air-publisher"
version = "0.1.0"
description = "No-Git Markdown wiki publisher"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
  "httpx>=0.28",
  "langchain-core>=1.4",
  "langchain-openai>=1.3",
  "openpyxl>=3.1",
  "pathspec>=1.1",
  "pydantic>=2.13",
  "pypdf>=6.0",
  "python-docx>=1.2",
  "python-dotenv>=1.2",
  "python-pptx>=1.0",
  "requests>=2.32",
  "sqlite-vec>=0.1",
]

[tool.uv]
package = false
